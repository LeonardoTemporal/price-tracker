name: Dokploy Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Dokploy Webhook
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              --fail-with-body
          else
            echo "DOKPLOY_WEBHOOK_URL not set. Skipping webhook trigger."
            echo "Set this secret in your repository settings to enable auto-deploy."
          fi
